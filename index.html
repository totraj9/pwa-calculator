<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tunable White Controller</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: #222;
      padding: 25px;
      width: 320px;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    h2 {
      text-align: center;
    }

    .section {
      margin-top: 18px;
    }

    input[type=range] {
      width: 100%;
    }

    .value {
      text-align: right;
      font-size: 14px;
    }

    .status {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      color: #00ffcc;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>🌈 Tunable White</h2>

  <div class="section">
    <label>
      <input type="checkbox" id="mixToggle" onchange="toggleMixing()">
      Enable Color Mixing
    </label>
  </div>

  <div class="section">
    <div>Master (Cool ⇄ Warm)</div>
    <input type="range" min="0" max="100" value="50"
           id="masterSlider" disabled
           oninput="setMaster(this.value)">
    <div class="value" id="masterVal">50%</div>
  </div>

  <div class="section">
    <div>Cool White</div>
    <input type="range" min="0" max="100" value="50"
           id="coolSlider"
           oninput="setCool(this.value)">
    <div class="value" id="coolVal">50%</div>
  </div>

  <div class="section">
    <div>Warm White</div>
    <input type="range" min="0" max="100" value="50"
           id="warmSlider"
           oninput="setWarm(this.value)">
    <div class="value" id="warmVal">50%</div>
  </div>

  <div class="status" id="status">
    Manual Mode
  </div>
</div>

<script>

const ESP_IP = "http://192.168.0.200/set";   // 🔥 YOUR ESP32 FIXED IP

let mixing = false;

function sendToESP(cool, warm) {

  fetch(`${ESP_IP}?cool=${cool}&warm=${warm}`)
    .then(res => res.text())
    .then(data => console.log("ESP:", data))
    .catch(err => console.log("Error:", err));
}

function toggleMixing() {

  mixing = document.getElementById("mixToggle").checked;

  document.getElementById("masterSlider").disabled = !mixing;
  document.getElementById("coolSlider").disabled = mixing;
  document.getElementById("warmSlider").disabled = mixing;

  document.getElementById("status").innerText =
    mixing ? "Mixing Mode Active" : "Manual Mode";

  sendToESP(
    document.getElementById("coolSlider").value,
    document.getElementById("warmSlider").value
  );
}

function setMaster(val) {

  document.getElementById("masterVal").innerText = val + "%";

  let cool = 100 - val;
  let warm = val;

  document.getElementById("coolSlider").value = cool;
  document.getElementById("warmSlider").value = warm;

  document.getElementById("coolVal").innerText = cool + "%";
  document.getElementById("warmVal").innerText = warm + "%";

  sendToESP(cool, warm);
}

function setCool(val) {
  document.getElementById("coolVal").innerText = val + "%";
  sendToESP(val, document.getElementById("warmSlider").value);
}

function setWarm(val) {
  document.getElementById("warmVal").innerText = val + "%";
  sendToESP(document.getElementById("coolSlider").value, val);
}

// Register Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

</script>

</body>
</html>

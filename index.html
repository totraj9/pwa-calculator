<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LED Control</title>

  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      width: 280px;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    h2 {
      margin-bottom: 10px;
    }

    .status {
      margin: 10px 0;
      font-weight: bold;
    }

    .on {
      color: green;
    }

    .off {
      color: red;
    }

    button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-on {
      background: #28a745;
      color: white;
    }

    .btn-off {
      background: #dc3545;
      color: white;
    }

    input[type=range] {
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>LED Control</h2>

  <div id="status" class="status off">LED OFF</div>

  <button class="btn-on" onclick="ledOn()">LED ON</button>
  <button class="btn-off" onclick="ledOff()">LED OFF</button>

  <p>Brightness</p>
  <input type="range" min="0" max="100" value="50" oninput="setBrightness(this.value)">
  <p id="brightnessValue">50%</p>
</div>

<script>
  function ledOn() {
    document.getElementById("status").innerText = "LED ON";
    document.getElementById("status").className = "status on";

    console.log("LED ON command");
  }

  function ledOff() {
    document.getElementById("status").innerText = "LED OFF";
    document.getElementById("status").className = "status off";

    console.log("LED OFF command");
  }

  function setBrightness(val) {
    document.getElementById("brightnessValue").innerText = val + "%";
    console.log("Brightness:", val);
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>

</body>
</html>

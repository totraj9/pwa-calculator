<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tunable White LED</title>

  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      width: 300px;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 0 15px rgba(0,0,0,0.15);
    }

    h2 {
      text-align: center;
      margin-bottom: 10px;
    }

    .section {
      margin-top: 15px;
    }

    .label {
      font-weight: bold;
      margin-bottom: 5px;
    }

    input[type=range] {
      width: 100%;
    }

    .value {
      text-align: right;
      font-size: 14px;
    }

    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status {
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>Tunable White</h2>

  <!-- Mixing Toggle -->
  <div class="section toggle">
    <span>Color Mixing</span>
    <input type="checkbox" id="mixToggle" onchange="toggleMixing()">
  </div>

  <!-- Master Slider -->
  <div class="section">
    <div class="label">Master Color (Cool ⇄ Warm)</div>
    <input type="range" min="0" max="100" value="50"
           id="masterSlider" disabled
           oninput="setMasterMix(this.value)">
    <div class="value" id="masterValue">50%</div>
  </div>

  <!-- Cool White -->
  <div class="section">
    <div class="label">Cool White</div>
    <input type="range" min="0" max="100" value="50"
           id="coolSlider"
           oninput="setCool(this.value)">
    <div class="value" id="coolValue">50%</div>
  </div>

  <!-- Warm White -->
  <div class="section">
    <div class="label">Warm White</div>
    <input type="range" min="0" max="100" value="50"
           id="warmSlider"
           oninput="setWarm(this.value)">
    <div class="value" id="warmValue">50%</div>
  </div>

  <div class="status" id="status">
    Mixing OFF – Manual Control
  </div>
</div>
<script>
  let mixingEnabled = false;

  const API_URL = "https://your-backend-domain.com/api/led/tunable";
  // later: replace with real backend URL

  function sendToBackend(cool, warm) {
    const payload = {
      mixing: mixingEnabled,
      cool: Number(cool),
      warm: Number(warm)
    };

    fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      console.log("Backend ACK:", data);
    })
    .catch(err => {
      console.error("API error:", err);
    });
  }

  function toggleMixing() {
    mixingEnabled = document.getElementById("mixToggle").checked;

    document.getElementById("masterSlider").disabled = !mixingEnabled;
    document.getElementById("coolSlider").disabled = mixingEnabled;
    document.getElementById("warmSlider").disabled = mixingEnabled;

    document.getElementById("status").innerText =
      mixingEnabled ? "Mixing ON – Master Control"
                    : "Mixing OFF – Manual Control";

    sendToBackend(
      document.getElementById("coolSlider").value,
      document.getElementById("warmSlider").value
    );
  }

  function setMasterMix(val) {
    document.getElementById("masterValue").innerText = val + "%";

    let cool = 100 - val;
    let warm = val;

    document.getElementById("coolSlider").value = cool;
    document.getElementById("warmSlider").value = warm;

    document.getElementById("coolValue").innerText = cool + "%";
    document.getElementById("warmValue").innerText = warm + "%";

    sendToBackend(cool, warm);
  }

  function setCool(val) {
    document.getElementById("coolValue").innerText = val + "%";
    sendToBackend(val, document.getElementById("warmSlider").value);
  }

  function setWarm(val) {
    document.getElementById("warmValue").innerText = val + "%";
    sendToBackend(document.getElementById("coolSlider").value, val);
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>

</body>
</html>
